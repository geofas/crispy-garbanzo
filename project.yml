# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
name: Nudgy
options:
  bundleIdPrefix: com.georgfasching
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple Developer Team ID here (or pick the team once in Xcode).
    DEVELOPMENT_TEAM: ""

packages:
  NudgyKit:
    path: NudgyKit

targets:
  Nudgy:
    type: application
    platform: iOS
    sources:
      - Nudgy
      - Shared
    dependencies:
      - package: NudgyKit
      - target: NudgyWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.georgfasching.nudgy
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Theme icons; names must match Theme.alternateIconName in NudgyKit.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-QuietSignal AppIcon-FriendlyTap"
    info:
      path: Nudgy/Info.plist
      properties:
        CFBundleDisplayName: Nudgy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - SpaceGrotesk.ttf
          - Figtree.ttf
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Nudgy/Nudgy.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true

  NudgyWatch:
    type: application
    platform: watchOS
    sources:
      - NudgyWatch
      - Shared
    dependencies:
      - package: NudgyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.georgfasching.nudgy.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: NudgyWatch/Info.plist
      properties:
        CFBundleDisplayName: Nudgy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.georgfasching.nudgy
        WKBackgroundModes:
          - mindfulness
        UIAppFonts:
          - SpaceGrotesk.ttf
          - Figtree.ttf

schemes:
  Nudgy:
    build:
      targets:
        Nudgy: all
    test:
      targets: []
  # Runs the Watch app directly on the Watch from Xcode (more reliable than
  # installing through the Watch app on the iPhone while developing).
  NudgyWatch:
    build:
      targets:
        NudgyWatch: all
    run:
      config: Debug
